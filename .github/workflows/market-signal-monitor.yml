name: Market signal monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-signal-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before research
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect configured sources
        id: collect
        run: echo "file=$(python scripts/market_signal_action.py collect)" >> "$GITHUB_OUTPUT"

      - name: Validate collector
        run: |
          python -m compileall -q scripts
          git diff --check

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-signal-candidates-${{ github.run_id }}
          path: ${{ steps.collect.outputs.file }}
          if-no-files-found: error
          retention-days: 30
