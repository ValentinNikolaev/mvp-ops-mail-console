name: Market signal monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-signal-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before research
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect configured sources
        id: collect
        run: echo "file=$(python scripts/market_signal_action.py collect)" >> "$GITHUB_OUTPUT"

      - name: Review candidates with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
        run: python scripts/market_signal_action.py review --candidates "${{ steps.collect.outputs.file }}"

      - name: Validate generated research files
        run: |
          python -m compileall -q scripts
          git diff --check

      - name: Commit and push research changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No research changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -qv '^research/logs/'; then
            git commit -m "research: hourly signal update $(date -u +%F\ %H%M)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Only run logs changed; leaving them uncommitted by policy."
          fi
